# The CLI crate. `obsidian` is on by default; `session` and `unrestricted` are opt-in features.

[package]
name = "remargin"
description = "CLI binary for the remargin document access layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "remargin"
path = "src/main.rs"

[features]
# `obsidian` is on by default so the plugin's Update button can run `remargin obsidian install`
# on any cargo-installed binary; opt out with `--no-default-features --features "zod jsonschema"`.
default = ["zod", "jsonschema", "obsidian"]
unrestricted = ["remargin-core/unrestricted"]
zod = ["remargin-core/zod"]
jsonschema = ["remargin-core/jsonschema"]
# The `remargin obsidian install|uninstall` subcommand. Install fetches `main.js` and
# `manifest.json` from the matching GitHub release at runtime, so the CLI needs no TypeScript build.
obsidian = ["dep:ureq"]
# `remargin session launch` and its dry-run discovery table. Off by default so a shipped binary
# stays lean; it turns on session discovery in remargin-core.
session = ["remargin-core/session"]

[dependencies]
remargin-core.workspace = true

clap.workspace = true

# Base64 (binary payloads for `get --binary --json`)
base64.workspace = true

serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true

# System abstraction (filesystem, env, temp dirs)
os-shim.workspace = true

anyhow.workspace = true

chrono.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP client (only compiled with the `obsidian` feature).
ureq = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# tests/adapter_loc_cap.rs parses main.rs and mcp.rs; `span-locations` exposes `Span::start()` /
# `Span::end()`, which measure each function's physical line span.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "parsing"] }
tempfile.workspace = true
