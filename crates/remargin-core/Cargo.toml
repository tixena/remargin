# The core library crate: every operation the CLI and the MCP server expose lives here.

[package]
name = "remargin-core"
description = "Core library for the remargin document access layer and review protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
unrestricted = []
# Optional `session:` config block (SessionConfig + humantime duration
# parsing). Off by default so the default build stays feature-free.
session = ["dep:humantime"]

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true

# System abstraction (filesystem, env, temp dirs)
os-shim.workspace = true

# TypeScript type + Zod schema generation from Rust models
tixschema.workspace = true

# Cryptography (checksums, signatures)
sha2.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
getrandom.workspace = true
base64.workspace = true

anyhow.workspace = true
thiserror.workspace = true

tempfile.workspace = true
ignore.workspace = true

# Image sampling / cropping for binary attachments
image.workspace = true

chrono.workspace = true

# Random ID generation
rand.workspace = true

regex.workspace = true

# Human-friendly duration parsing for the `session:` block (session feature).
humantime = { workspace = true, optional = true }

tracing.workspace = true

[dev-dependencies]
# Names the stream types of the `System` that `operations/mv/tests.rs` implements.
futures-io.workspace = true
tempfile.workspace = true
